[project]
name = "urban-model"
version = "0.5.7"
description = "Математическая модель застройки территории: обратный расчёт КИТ + Optuna-оптимизация"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "optuna>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
    "streamlit>=1.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urban_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
