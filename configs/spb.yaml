# === Экономика (v0.8.0): условные единицы ===
# Базовая единица: 1.0 = себестоимость м² жилья 9-эт. монолита со standard-отделкой.
# Все стоимости и цены — относительно этого. Подробности — SPEC.md.
economy:
  base_unit:
    type: scalar
    value: 1.0
    note: "1.0 = себестоимость м² жилья 9-этажного монолита со standard-отделкой"
    source: "принято условно (SPEC.md)"

  construction:
    # Базовая стоимость м² GFA жилых зданий — piecewise по этажности
    residential_by_floors:
      type: piecewise
      argument: floors
      breakpoints:
        - { up_to: 5,    value: 0.92 }     # low_5fl кирпич/панель
        - { up_to: 9,    value: 1.00 }     # mid_9fl monolith (референс)
        - { up_to: 12,   value: 1.10 }     # high_12fl
        - { up_to: 17,   value: 1.20 }     # high_17fl
        - { up_to: 22,   value: 1.35 }     # tower_22fl
        - { up_to: .inf, value: 1.48 }     # tower_25fl+
      unit: "unit_per_m2_gfa"
      source: "SPEC.md (стартовые коэф, типичные пропорции РФ)"
    # v0.10.17 (аудит #2): повышающий коэффициент себестоимости по классу.
    # Бизнес дороже строить (фасады, инженерия, МОП, отделка, высота этажей),
    # эконом — дешевле. Без него бизнес-класс выглядел чрезмерно прибыльным
    # (ROI ~36% при той же себестоимости) и почти всегда побеждал в оптимизаторе.
    residential_class_factor:
      type: conditional
      argument: residential_class
      cases:
        economy:  0.88
        comfort:  1.00
        business: 1.15
      unit: "multiplier"
      source: "оценка по практике СПб (фасады/инженерия/отделка бизнес-класса)"
    vpp_commercial:
      type: scalar
      value: 0.78
      unit: "unit_per_m2_built_in"
      note: "shell&core коммерческой ВПП (без отделки)"
      source: "SPEC.md"
    kindergarten:
      type: scalar
      value: 1.40
      unit: "unit_per_m2_building"
      source: "SPEC.md (спецтребования к ДОО)"
    school:
      type: scalar
      value: 1.30
      unit: "unit_per_m2_building"
      source: "SPEC.md"
    add_education:
      type: scalar
      value: 1.30
      unit: "unit_per_m2_building"
      note: "доп. образование (ВРИ 3.5.1) — близко к СОШ по спецтребованиям"
      source: "SPEC.md (оценка)"
    polyclinic:
      type: scalar
      value: 1.45
      unit: "unit_per_m2_building"
      note: "поликлиника (ВРИ 3.4.1) — спецтребования (медоборудование/инженерия)"
      source: "SPEC.md (оценка)"
    # v0.9.8: калибровка себестоимости под реальные цены СПб 2024.
    # Раньше 0.20/0.50/1.00 — взято из SPEC.md без привязки к рынку,
    # давало убыток всех типов парковок (open: cost 4.15 vs sale 3.0,
    # ml: cost 14 vs sale 10, ug: cost 35 vs sale 18).
    # После калибровки маржа:
    #   open  L1: cost ~1.0,  sale 3.0  → ~+200% (выгодны)
    #   ml    L1: cost ~8.4,  sale 10   → ~+19%  (умеренно выгодны)
    #   ug    L1: cost ~14,   sale 18   → ~+29%  (выгодны)
    #   ug    L2: cost ~18.2, sale 18   → ~0%    (граница)
    #   ug    L3: cost ~23.1, sale 18   → ~-22%  (убыток; типично)
    parking_surface:
      type: scalar
      value: 0.05
      unit: "unit_per_m2"
      note: "≈ 10 тыс ₽/м² (асфальт + разметка)"
      source: "СПб 2024 (asphalt cost / P_comfort)"
    parking_multilevel:
      type: scalar
      value: 0.30
      unit: "unit_per_m2"
      note: "≈ 60 тыс ₽/м² (монолит + перекрытия, без отделки)"
      source: "СПб 2024"
    parking_underground:
      type: scalar
      value: 0.40
      unit: "unit_per_m2"
      note: "≈ 80 тыс ₽/м² (земляные + гидроизоляция + рампы)"
      source: "СПб 2024"
    # v0.12.2: стилобат — средне-высокая себестоимость между МУ (0.30) и
    # подземкой (0.40): монолитная дека над землёй, без земляных/гидроизоляции,
    # но с усиленными перекрытиями под двор/озеленение сверху.
    parking_stylobate:
      type: scalar
      value: 0.34
      unit: "unit_per_m2"
      note: "монолитная дека + эксплуатируемая кровля (двор); без заглубления"
      source: "принято условно (между МУ и подземкой)"
    # все три верхних имеют source — ок
    # Прогрессия удорожания подземных уровней (level N относительно level 1).
    # v0.9.12 (AUDIT P2-6): раньше 4-й и 5-й уровни имели одинаковый множитель
    # 2.05 (т.к. last step был .inf). Теперь явно различаем: каждый уровень
    # глубже добавляет ~25-30% к стоимости (земляные работы + гидроизоляция
    # + дренаж + рампы). ParkingConfig.underground_levels ∈ [1..5].
    underground_progression:
      type: piecewise
      argument: level
      breakpoints:
        - { up_to: 1,    value: 1.00 }
        - { up_to: 2,    value: 1.30 }
        - { up_to: 3,    value: 1.65 }
        - { up_to: 4,    value: 2.05 }
        - { up_to: 5,    value: 2.50 }
        - { up_to: .inf, value: 3.00 }
      unit: "multiplier"
      source: "принято условно (типовая прогрессия подрядчиков СПб)"

  # Себестоимость инженерных объектов (v0.12) — ОРИЕНТИРЫ в условных единицах.
  # ВНИМАНИЕ: значения предварительные, подлежат уточнению по НЦС Минстроя РФ
  # (сборники на наружные электросети / котельные / водоотведение). Инженерка —
  # малая доля бюджета, поэтому грубой оценки достаточно для сравнения вариантов.
  # Котельная и ОСПС масштабируются по мощности; остальные — по объекту.
  engineering_cost:
    tp_per_object:
      type: scalar
      value: 90
      unit: "unit_per_object"
      source: "ориентир, уточнить по НЦС 81-02-19 (наружные электросети)"
    rtp_per_object:
      type: scalar
      value: 200
      unit: "unit_per_object"
      source: "ориентир, уточнить по НЦС 81-02-19"
    boiler_per_mw:
      type: scalar
      value: 150
      unit: "unit_per_MW"
      source: "ориентир, уточнить по НЦС 81-02-13 (котельные/тепловые сети)"
    grp_per_object:
      type: scalar
      value: 60
      unit: "unit_per_object"
      source: "ориентир, уточнить по НЦС (газоснабжение)"
    osps_per_m3day:
      type: scalar
      value: 1.2
      unit: "unit_per_m3_day"
      source: "ориентир, уточнить по НЦС (водоотведение)"
    pump_per_object:
      type: scalar
      value: 120
      unit: "unit_per_object"
      source: "ориентир, уточнить по НЦС (водоотведение)"

  overhead:
    pct_networks:
      type: scalar
      value: 0.10
      note: "сети — 10% от стоимости зданий"
      source: "принято условно (SPEC.md)"
    pct_landscaping:
      type: scalar
      value: 0.05
      note: "благоустройство — 5%"
      source: "принято условно (SPEC.md)"
    pct_design:
      type: scalar
      value: 0.05
      note: "проектирование/изыскания — 5%"
      source: "принято условно (SPEC.md)"
    pct_contingency:
      type: scalar
      value: 0.07
      note: "непредвиденные — 7% от (shell + сети + ландшафт + проект)"
      source: "принято условно (SPEC.md)"

  sale_prices:
    # Цена м² квартир по классу жилья
    residential_by_class:
      type: conditional
      argument: residential_class
      cases:
        economy:  1.70
        comfort:  1.95
        business: 2.80
      unit: "unit_per_m2_apartments"
      source: "SPEC.md (типичная маржа РФ для эконома/комфорта/бизнеса); economy 1.55→1.70 по внешнему аудиту v0.10.20 (1.55 был заниженным стресс-вариантом)"
    # v0.9.1: калибровка по СПб 2024. Раньше (0.10/0.25/0.50) — кратно
    # заниженные значения из SPEC.md, давшие убыток у всех типов парковок.
    # Новые значения отражают реальные цены продажи м/м в СПб:
    #   подземное 1.5-2.5 млн руб ≈ 18 × P_comfort
    #   многоуровневое 0.8-1.2 млн руб ≈ 10 × P_comfort
    #   открытое 0.2-0.4 млн руб ≈ 3 × P_comfort
    parking_underground:
      type: scalar
      value: 18.0
      unit: "unit_per_space"
      note: "1.5-2.5 млн руб ≈ 18 у.е. (через P_comfort = 1.95 у.е./м²)"
      source: "СПб 2024, средняя по проектам комфорт-класса"
    parking_multilevel:
      type: scalar
      value: 10.0
      unit: "unit_per_space"
      note: "0.8-1.2 млн руб ≈ 10 у.е."
      source: "СПб 2024"
    parking_surface:
      type: scalar
      value: 3.0
      unit: "unit_per_space"
      note: "0.2-0.4 млн руб ≈ 3 у.е."
      source: "СПб 2024"
    # v0.12.2: стилобатное м/м — цена между многоуровневым (10) и подземным
    # (18): закрытое, в составе двора-стилобата, привлекательнее открытого МУ.
    parking_stylobate:
      type: scalar
      value: 13.0
      unit: "unit_per_space"
      note: "закрытое стилобатное м/м; между МУ и подземкой"
      source: "принято условно (СПб 2024)"
    vpp_commercial:
      type: scalar
      value: 1.30
      unit: "unit_per_m2"
      source: "SPEC.md (shell&core ритейл с отделкой арендатора)"

  # v0.9.14: доля реализации (продажи) машино-мест по классу жилья.
  # Раньше модель считала, что 100% построенных м/м продаются — это
  # завышало выручку парковок. В реальности доля покупки м/м сильно
  # зависит от класса: в эконом-классе берут редко, в бизнесе почти все.
  # Непроданные места приносят 0 выручки, но затраты на них уже понесены
  # (входят в cost.total) — поэтому избыточная подземка топит экономику.
  # v0.12.2: пригодность типов парковки по классу жилья (0…1). Используется
  # «Девелоперским» вариантом оптимизатора как parking_rationality: уклон в
  # типы, рыночно уместные для класса. Источник — экспертная оценка заказчика.
  #   Эконом:  открытые лучше всего, МУ ок, подземка слабая (дорого/мало берут),
  #            стилобат возможен.
  #   Комфорт: МУ — лучший компромисс, стилобат очень хорош, подземка допустима,
  #            открытые хуже (качество среды).
  #   Бизнес:  подземка лучшая, стилобат тоже хорош, МУ ок, открытые слабые.
  parking_suitability:
    type: conditional
    argument: residential_class
    cases:
      economy:  { open: 1.0, multilevel: 0.7, underground: 0.3, stylobate: 0.5 }
      comfort:  { open: 0.6, multilevel: 1.0, underground: 0.6, stylobate: 0.8 }
      business: { open: 0.3, multilevel: 0.6, underground: 1.0, stylobate: 0.8 }
    source: "экспертная оценка заказчика (рыночная уместность по классам)"

  # v0.12.7: ПРЕДЕЛЬНЫЕ доли типов парковки по классу жилья (доля от общего
  # числа м/м). В отличие от мягкой parking_suitability — это ЖЁСТКИЕ потолки:
  # оптимизатор не генерирует и не рекомендует миксы, где доля типа превышает
  # потолок класса (с откатом, если на плотном участке иначе невозможно).
  # Источник — экспертная оценка заказчика (реалистичные миксы по классам):
  #   Эконом:  открытые без огр.; МУ — главный компромисс (70%); стилобат
  #            ограниченно (35%, конструктивно сложнее); подземка ≤20% (добивка).
  #   Комфорт: открытые до 70% (не загонять в МУ на неплотных участках); МУ
  #            свободно; стилобат/подземка до 60%.
  #   Бизнес:  открытые ≤40%; МУ ≤60% (не дают «бизнесовости»); стилобат ≤70%;
  #            подземка без огр. (предпочтительна).
  parking_caps:
    type: conditional
    argument: residential_class
    cases:
      economy:  { open: 1.0, multilevel: 0.70, underground: 0.20, stylobate: 0.35 }
      comfort:  { open: 0.70, multilevel: 1.0, underground: 0.60, stylobate: 0.60 }
      business: { open: 0.40, multilevel: 0.60, underground: 1.0, stylobate: 0.70 }
    source: "экспертная оценка заказчика (предельные реалистичные доли по классам)"

  sale_rates:
    parking_by_class:
      type: conditional
      argument: residential_class
      cases:
        economy:  0.20    # эконом: м/м почти не покупают
        comfort:  0.45    # комфорт: 35-60% (берём середину)
        business: 0.75    # бизнес: 60-90%
      unit: "share"
      source: "СПб 2024 (доля реализации м/м по классам)"

  # v0.9.14: компенсация соцобъектов городом (бюджет / выкуп / льготы).
  # В реальной практике СПб застройщик НЕ строит ДОО/СОШ за чистый убыток —
  # часть затрат компенсируется бюджетом (выкуп объекта городом, льготы по
  # КОТ, мены и т.п.). Типичный диапазон: 60-90% от себестоимости объекта.
  # При 0 — соцобъекты полностью на застройщике (старая модель v0.9.13).
  # При 1.0 — полная компенсация.
  social_compensation:
    share:
      type: scalar
      value: 0.7
      note: "доля компенсации затрат на ДОО/СОШ от их себестоимости"
      source: "СПб 2024 (типовые соглашения КОТ/выкупа)"

  # Площадь м/м по типам — для расчёта стоимости через площадь, а не «штуки»
  parking_areas:
    underground_m2_per_space:
      type: scalar
      value: 35
      unit: "m2"
      source: "SPEC.md / СП 113.13330"
    multilevel_m2_per_space:
      type: scalar
      value: 28
      unit: "m2"
      source: "SPEC.md"
    # v0.9.11 (AUDIT P0-1): surface_m2_per_space удалён — экономика читает
    # parking.open_space_per_place=20.75 из основного норматива (единый
    # источник истины для площади открытого м/м).
