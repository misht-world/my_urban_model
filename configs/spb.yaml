# Нормативы Санкт-Петербурга.
# Параметры, отсутствующие здесь, наследуются из russia.yaml.
parent: russia

# Семантические алиасы поверх ВРИ.
# В v0.1 жилая многоэтажная — ВРИ 2.6; ДОО/СОШ хранятся в social_objects (не по ВРИ).
aliases:
  housing: "vri.2.6"

# === Жильё ===

housing_provision:
  type: scalar
  value: 28
  unit: "m2_apartments_per_person"
  note: "региональная жилищная обеспеченность"
  source: "НГП СПб"

# КИТ: с/без ППТ
kit_limits:
  type: conditional
  argument: planning_doc
  cases:
    "yes": 2.5
    "no": 1.4
  source: "ПЗЗ СПб"

# Параметры жилых зданий (приняты условно)
building_params:
  apartments_to_gfa_ratio:
    type: scalar
    value: 0.75
    note: "коэффициент приведения общей площади к площади квартир (без ВПП)"
    source: "принято условно"
  residential_floor_height:
    type: scalar
    value: 3.0
    unit: "m"
    source: "принято условно"
  vpp_floor_height:
    type: scalar
    value: 4.0
    unit: "m"
    source: "принято условно"
  non_residential_floor_height:
    type: scalar
    value: 3.2
    unit: "m"
    source: "принято условно"

# === ЗНОП — кусочно-постоянная функция от КИТ ===
znop_per_person:
  type: piecewise
  argument: kit
  breakpoints:
    - { up_to: 1.59, value: 0 }
    - { up_to: 1.79, value: 3 }
    - { up_to: 1.99, value: 4 }
    - { up_to: 2.50, value: 6 }
  unit: "m2_per_person"
  source: "ПЗЗ СПб"

# === Озеленение ===
greening:
  housing_per_apartments:
    type: scalar
    value: 0.23
    note: "23 м² озеленения на 100 м² площади квартир (доля)"
    source: "ПЗЗ СПб"
  vpp_per_floor_area:
    type: scalar
    value: 0.15
    note: "15 м² на 100 м² встроенно-пристроенных помещений"
    source: "ПЗЗ СПб"

# === ДОО ===
social_objects:
  kindergarten:
    places_per_1000:
      type: scalar
      value: 61
      unit: "places_per_1000_people"
      source: "НГП СПб"
    rounding:
      type: scalar
      value: 5
      note: "округление вместимости вверх кратно 5"
      source: "НГП СПб"
    plot_area_per_place:   # переопределяет russia (отдельно стоящий ДОО)
      type: piecewise
      argument: capacity
      breakpoints:
        - { up_to: 100, value: 45 }
        - { up_to: .inf, value: 40 }
      unit: "m2_per_place"
      source: "РМД 31-07-2009"
    plot_area_per_place_built_in:   # встроенно-пристроенный ДОО (1-й этаж жилого дома)
      type: scalar
      value: 24
      unit: "m2_per_place"
      note: "минимальный участок для встроенно-пристроенного ДОО"
      source: "ПЗЗ СПб"
    # Список допустимых вместимостей ДОО (по данным КС). Если расчётная
    # вместимость не из списка — выдаётся WARNING с указанием ближайших.
    allowed_capacities:
      type: list
      values: [90, 100, 110, 120, 140, 150, 160, 165, 170, 180, 190, 200, 215, 220, 230, 240, 250, 260, 280, 310, 320, 340, 350]
      note: "типовые вместимости ДОО для отдельно стоящих и встроенных корпусов"
      source: "Данные КС по Замечаниям (ДОО - Санкт-Петербург)"
    building_area_per_place:
      type: piecewise
      argument: capacity
      breakpoints:
        - { up_to: 160, value: 30 }
        - { up_to: 220, value: 28 }
        - { up_to: .inf, value: 25 }
      unit: "m2_per_place"
      source: "РМД 15-26-2017"
    capacity_min:
      type: conditional
      argument: building_type
      cases:
        detached: 160   # нижний предел отдельно стоящего ДОО
        built_in: 120   # не менее 120 мест (минимальная наполняемость)
      source: "Письмо К.Обр №03-28-3794/21-0-0 от 29.04.2021"
    capacity_max:
      type: conditional
      argument: building_type
      cases:
        detached: 350
        built_in: 350   # явный максимум не установлен; принято как для отдельно стоящего
      sources:
        detached: "РМД 15-26-2017"
        built_in: "принято условно (явный предел нормативами не установлен)"
    # Число работников по вместимости (для расчёта парковок ДОО).
    # Значения по типовым проектам КС: точные для capacity ∈ {160, 220, 250},
    # остальное — линейная интерполяция/экстраполяция.
    workers_per_capacity:
      type: piecewise
      argument: capacity
      breakpoints:
        - { up_to: 90,  value: 33 }
        - { up_to: 100, value: 35 }
        - { up_to: 110, value: 38 }
        - { up_to: 120, value: 40 }
        - { up_to: 140, value: 45 }
        - { up_to: 150, value: 48 }
        - { up_to: 160, value: 50 }
        - { up_to: 165, value: 51 }
        - { up_to: 170, value: 53 }
        - { up_to: 180, value: 55 }
        - { up_to: 190, value: 58 }
        - { up_to: 200, value: 60 }
        - { up_to: 215, value: 64 }
        - { up_to: 220, value: 65 }
        - { up_to: 230, value: 68 }
        - { up_to: 240, value: 72 }
        - { up_to: 250, value: 75 }
        - { up_to: 260, value: 78 }
        - { up_to: 280, value: 85 }
        - { up_to: 310, value: 95 }
        - { up_to: 320, value: 98 }
        - { up_to: 340, value: 105 }
        - { up_to: .inf, value: 108 }
      unit: "workers"
      note: "Данные КС: точные значения для 160/220/250 мест; остальное — интерполяция"
      source: "Данные КС по Замечаниям (ДОО - Санкт-Петербург)"

  school:
    places_per_1000:
      type: scalar
      value: 120
      unit: "places_per_1000_people"
      source: "НГП СПб"
    rounding:
      type: scalar
      value: 25
      note: "округление вместимости вверх кратно 25 (1 параллель ≈ 25 мест)"
      source: "СП 42.13330.2016 (СП «Градостроительство»)"
    # Список допустимых вместимостей СОШ (по числу параллелей II–IX).
    # Если расчётная вместимость не попадает в список — выдаётся WARNING с
    # указанием ближайших значений из списка.
    allowed_capacities:
      type: list
      values: [550, 825, 1100, 1375, 1650, 1925, 2200, 2475]
      note: "II=550, III=825, IV=1100, V=1375, VI=1650, VII=1925, VIII=2200, IX=2475"
      source: "Данные КС по Замечаниям (СОШ - Санкт-Петербург)"
    # Площадь земельного участка на 1 место (переопределяет russia).
    # Значения II→35, III→28, IV/V→24, VI–IX→22 соответствуют СП 42.13330.2016
    # табл. 10.2 (св.30 мест) и уточнены конструкторами под типовые проекты СПб.
    plot_area_per_place:
      type: piecewise
      argument: capacity
      breakpoints:
        - { up_to: 550, value: 35 }
        - { up_to: 825, value: 28 }
        - { up_to: 1375, value: 24 }
        - { up_to: .inf, value: 22 }
      unit: "m2_per_place"
      note: "по параллелям II–IX (СП 42 + уточнения КС)"
      source: "СП 42.13330.2016, табл. 10.2 / уточнено по данным КС"
    building_area_per_place:
      type: piecewise
      argument: capacity
      breakpoints:
        - { up_to: 825, value: 30 }    # II, III параллели
        - { up_to: .inf, value: 25 }    # IV+
      unit: "m2_per_place"
      note: "II/III → 30, IV+ → 25 (РМД 15-26-2017 + уточнения КС)"
      source: "РМД 15-26-2017 / уточнено по данным КС"
    capacity_min:
      type: conditional
      argument: building_type
      cases:
        detached: 550
      source: "Письмо К.Обр №03-28-3794/21-0-0 от 29.04.2021"
    capacity_max:
      type: conditional
      argument: building_type
      cases:
        detached: 2475
      note: "Типовая школа: II/III/IV/V/VI/VII/VIII/IX параллели = 550/825/1100/1375/1650/1925/2200/2475 мест. Свыше 2475 — разбивать на корпуса."
      source: "Данные КС по Замечаниям"
    # Число работников по вместимости (для расчёта парковок СОШ).
    # Значения для параллелей II–IX (550/825/1100/1375/1650/1925/2200/2475).
    # Точные данные КС для capacity ∈ {550, 825, 1375}; остальное — оценка.
    workers_per_capacity:
      type: piecewise
      argument: capacity
      breakpoints:
        - { up_to: 550,  value: 90 }
        - { up_to: 825,  value: 135 }
        - { up_to: 1100, value: 178 }
        - { up_to: 1375, value: 220 }
        - { up_to: 1650, value: 263 }
        - { up_to: 1925, value: 305 }
        - { up_to: 2200, value: 348 }
        - { up_to: .inf, value: 390 }
      unit: "workers"
      note: "Данные КС: точные для 550/825/1375; остальное — линейная экстраполяция."
      source: "Данные КС по Замечаниям (СОШ - Санкт-Петербург)"

# === Парковки ===
parking:
  housing:
    m2_apartments_per_place:
      type: scalar
      value: 80
      unit: "m2_apartments_per_place"
      note: "1 машино-место на 80 м² общей площади квартир (ВРИ 2.1.1, 2.5, 2.6)"
      source: "ПЗЗ СПб"
  # Парковочные нормы для всех ВПП и нежилых объектов: средний коэф.
  # v0.7.1.1: переход с conditional-по-ВРИ на единый «средний по объекту»
  # 1.56 м/м на 100 м² = 64 м²/м.м. Источник: усреднение по типовым ВРИ.
  vpp:
    m2_per_place:
      type: scalar
      value: 64
      unit: "m2_per_place"
      note: "средний коэф 1.56 м/м на 100 м² → 64 м²/м.м для всех ВПП и кастомных объектов"
      source: "усреднение по ПЗЗ СПб (1.56 м/м на 100 м²)"
  open_share_min:
    type: scalar
    value: 0.125
    note: "не менее 12,5% от требуемого количества м/м — открытые в уровне земли"
    source: "ПЗЗ СПб"
  open_space_per_place:
    type: scalar
    value: 20.75
    unit: "m2"
    note: "стандартное открытое м/м с частью проезда"
    source: "принято условно"
  mgn_space_per_place:
    type: scalar
    value: 32.4
    unit: "m2"
    note: "м/м МГН с частью проезда"
    source: "принято условно"
  multilevel_capacity_max:
    type: scalar
    value: 300
    unit: "places"
    note: "СПб; уточнить норматив"
    source: "СПб (уточнить)"
  # Максимальная вместимость одного подземного уровня. Условный потолок
  # для проверки реалистичности: при бо́льшем количестве подземных м/м
  # без увеличения числа уровней выдаётся WARNING (v0.8.5, AUDIT P0-7).
  underground_capacity_per_level:
    type: scalar
    value: 400
    unit: "places"
    note: "ориентир по типовому пятну подземки ~14000 м² (400 × 35 м²/место)"
    source: "принято условно"
  metro_proximity_discount:
    type: scalar
    value: 0.5
    note: "уменьшение на 50% в пределах 500 м от метрополитена"
    source: "ПЗЗ СПб <3>"

  # === Парковки соцобъектов (ДОО, СОШ) — v0.7.0 ===
  # Формула: 1 м/м на N работников + 1 м/м на M учащихся, не менее `minimum`.
  social_objects:
    per_worker:
      type: scalar
      value: 5
      note: "1 машино-место на 5 работников ДОО/СОШ"
      source: "ПЗЗ СПб"
    per_student:
      type: scalar
      value: 100
      note: "1 машино-место на 100 учащихся ДОО/СОШ"
      source: "ПЗЗ СПб"
    minimum:
      type: scalar
      value: 2
      note: "не менее 2 машино-мест на каждый объект ДОО/СОШ"
      source: "ПЗЗ СПб"

# === Проезды (приняты условно) ===
driveways:
  intra_quarter_share:
    type: scalar
    value: 0.10
    note: "доля от площади квартала"
    source: "принято условно"
  housing_lot_share:
    # Доля проездов на ЗУ жилой застройки от площади застройки. Зависит от
    # этажности: малоэтажная (≤4) застройка требует меньше проездов (100%
    # от пятна), многоэтажная — больше (120%, нужны разъезды/пожарные).
    type: piecewise
    argument: floors
    breakpoints:
      - { up_to: 4, value: 1.00 }
      - { up_to: .inf, value: 1.20 }
    note: "≤4 эт. — 100% от застройки; >4 эт. — 120%"
    source: "принято условно"

# === Обязательные ВПП по НГП СПб (v0.7.1) ===
# Источник: «Обязательные ВПП по НГП - Санкт-Петербург».
# Норматив задаёт ОБЪЁМ потребности (мест/посещ./м²) на 1000 жителей.
# Коэф пересчёта «единица → м²» — типовые из СП 31-110-2003 / СНиП.
mandatory_vpp:
  # ВРИ 4.4 — Магазины (предприятия торговли с радиусом обслуживания 500 м)
  shopping_4_4:
    vri_code: "4.4"
    area_per_1000:
      type: scalar
      value: 460.10
      unit: "m2_per_1000_people"
      note: "Площадь сразу в м² (без пересчёта)"
      source: "НГП СПб (приложение)"
  # ВРИ 4.6 — Предприятия общественного питания
  catering_4_6:
    vri_code: "4.6"
    seats_per_1000:
      type: scalar
      value: 105.20
      unit: "seats_per_1000_people"
      note: "посадочных мест на 1000 жителей"
      source: "НГП СПб (приложение)"
    m2_per_seat:
      type: scalar
      value: 6
      unit: "m2_per_seat"
      note: "1 посадочное место общепита ≈ 6 м² (зал + подсобка), принято условно"
      source: "СП 31-110-2003 (раздел 6); СНиП 2.08.02-89 — обоснование зала"
  # ВРИ 3.3 — Предприятия бытового обслуживания
  domestic_3_3:
    vri_code: "3.3"
    workplaces_per_1000:
      type: scalar
      value: 19
      unit: "workplaces_per_1000_people"
      source: "НГП СПб (приложение)"
    m2_per_workplace:
      type: scalar
      value: 20
      unit: "m2_per_workplace"
      note: "1 рабочее место быт.обсл. ≈ 20 м² (с учётом подсобок), принято условно"
      source: "СП 31-110-2003, прил. Б"
  # ВРИ 3.4.1 — Амбулаторно-поликлинические организации
  medical_3_4_1:
    vri_code: "3.4.1"
    visits_per_shift_per_1000:
      type: scalar
      value: 26.33
      unit: "visits_per_shift_per_1000_people"
      source: "НГП СПб (приложение)"
    m2_per_visit_per_shift:
      type: scalar
      value: 8
      unit: "m2_per_visit_per_shift"
      note: "1 посещение в смену ≈ 8 м², принято условно"
      source: "СНиП 2.08.02-89 / СП 158.13330"
  # ВРИ 3.5.1 — Школы искусств (доп. предпроф. программы)
  arts_3_5_1:
    vri_code: "3.5.1"
    seats_per_1000:
      type: scalar
      value: 7.20
      unit: "seats_per_1000_people"
      source: "НГП СПб (приложение)"
    m2_per_seat:
      type: scalar
      value: 15
      unit: "m2_per_seat"
      note: "1 место школы искусств ≈ 15 м² (учебно-творческие помещения), принято условно"
      source: "СП 31-110-2003 (учебно-творческие)"

# === Плоскостные спортивные сооружения (ВРИ 5.1.3) ===
sport_facilities:
  area_per_1000:
    type: scalar
    value: 1000
    unit: "m2_per_1000_people"
    note: "плоскостные спортивные сооружения на 1000 жителей"
    source: "НГП СПб"
  greening_ratio:
    type: scalar
    value: 0.4
    note: "минимальная доля озеленения ЗУ спортивных сооружений"
    source: "ПЗЗ СПб (ВРИ 5.1.3)"
  greening_substitution_max:
    type: scalar
    value: 0.49
    note: "макс. доля озеленения, замещаемая открытыми спорт-площадками (до 50% по п.1.9.4 ПЗЗ; 49% — для запаса)"
    source: "п. 1.9.4 ПЗЗ СПб (в т.ч. 1.9.3.2)"
  non_housing_lot_share:
    type: scalar
    value: 1.00
    note: "100% от площади застройки на нежилом ЗУ"
    source: "принято условно"

# === Экономика (v0.8.0): условные единицы ===
# Базовая единица: 1.0 = себестоимость м² жилья 9-эт. монолита со standard-отделкой.
# Все стоимости и цены — относительно этого. Подробности — SPEC.md.
economy:
  base_unit:
    type: scalar
    value: 1.0
    note: "1.0 = себестоимость м² жилья 9-этажного монолита со standard-отделкой"
    source: "принято условно (SPEC.md)"

  construction:
    # Базовая стоимость м² GFA жилых зданий — piecewise по этажности
    residential_by_floors:
      type: piecewise
      argument: floors
      breakpoints:
        - { up_to: 5,    value: 0.92 }     # low_5fl кирпич/панель
        - { up_to: 9,    value: 1.00 }     # mid_9fl monolith (референс)
        - { up_to: 12,   value: 1.10 }     # high_12fl
        - { up_to: 17,   value: 1.20 }     # high_17fl
        - { up_to: 22,   value: 1.35 }     # tower_22fl
        - { up_to: .inf, value: 1.48 }     # tower_25fl+
      unit: "unit_per_m2_gfa"
      source: "SPEC.md (стартовые коэф, типичные пропорции РФ)"
    # v0.10.17 (аудит #2): повышающий коэффициент себестоимости по классу.
    # Бизнес дороже строить (фасады, инженерия, МОП, отделка, высота этажей),
    # эконом — дешевле. Без него бизнес-класс выглядел чрезмерно прибыльным
    # (ROI ~36% при той же себестоимости) и почти всегда побеждал в оптимизаторе.
    residential_class_factor:
      type: conditional
      argument: residential_class
      cases:
        economy:  0.88
        comfort:  1.00
        business: 1.15
      unit: "multiplier"
      source: "оценка по практике СПб (фасады/инженерия/отделка бизнес-класса)"
    vpp_commercial:
      type: scalar
      value: 0.78
      unit: "unit_per_m2_built_in"
      note: "shell&core коммерческой ВПП (без отделки)"
      source: "SPEC.md"
    kindergarten:
      type: scalar
      value: 1.40
      unit: "unit_per_m2_building"
      source: "SPEC.md (спецтребования к ДОО)"
    school:
      type: scalar
      value: 1.30
      unit: "unit_per_m2_building"
      source: "SPEC.md"
    # v0.9.8: калибровка себестоимости под реальные цены СПб 2024.
    # Раньше 0.20/0.50/1.00 — взято из SPEC.md без привязки к рынку,
    # давало убыток всех типов парковок (open: cost 4.15 vs sale 3.0,
    # ml: cost 14 vs sale 10, ug: cost 35 vs sale 18).
    # После калибровки маржа:
    #   open  L1: cost ~1.0,  sale 3.0  → ~+200% (выгодны)
    #   ml    L1: cost ~8.4,  sale 10   → ~+19%  (умеренно выгодны)
    #   ug    L1: cost ~14,   sale 18   → ~+29%  (выгодны)
    #   ug    L2: cost ~18.2, sale 18   → ~0%    (граница)
    #   ug    L3: cost ~23.1, sale 18   → ~-22%  (убыток; типично)
    parking_surface:
      type: scalar
      value: 0.05
      unit: "unit_per_m2"
      note: "≈ 10 тыс ₽/м² (асфальт + разметка)"
      source: "СПб 2024 (asphalt cost / P_comfort)"
    parking_multilevel:
      type: scalar
      value: 0.30
      unit: "unit_per_m2"
      note: "≈ 60 тыс ₽/м² (монолит + перекрытия, без отделки)"
      source: "СПб 2024"
    parking_underground:
      type: scalar
      value: 0.40
      unit: "unit_per_m2"
      note: "≈ 80 тыс ₽/м² (земляные + гидроизоляция + рампы)"
      source: "СПб 2024"
    # все три верхних имеют source — ок
    # Прогрессия удорожания подземных уровней (level N относительно level 1).
    # v0.9.12 (AUDIT P2-6): раньше 4-й и 5-й уровни имели одинаковый множитель
    # 2.05 (т.к. last step был .inf). Теперь явно различаем: каждый уровень
    # глубже добавляет ~25-30% к стоимости (земляные работы + гидроизоляция
    # + дренаж + рампы). ParkingConfig.underground_levels ∈ [1..5].
    underground_progression:
      type: piecewise
      argument: level
      breakpoints:
        - { up_to: 1,    value: 1.00 }
        - { up_to: 2,    value: 1.30 }
        - { up_to: 3,    value: 1.65 }
        - { up_to: 4,    value: 2.05 }
        - { up_to: 5,    value: 2.50 }
        - { up_to: .inf, value: 3.00 }
      unit: "multiplier"
      source: "принято условно (типовая прогрессия подрядчиков СПб)"

  overhead:
    pct_networks:
      type: scalar
      value: 0.10
      note: "сети — 10% от стоимости зданий"
      source: "принято условно (SPEC.md)"
    pct_landscaping:
      type: scalar
      value: 0.05
      note: "благоустройство — 5%"
      source: "принято условно (SPEC.md)"
    pct_design:
      type: scalar
      value: 0.05
      note: "проектирование/изыскания — 5%"
      source: "принято условно (SPEC.md)"
    pct_contingency:
      type: scalar
      value: 0.07
      note: "непредвиденные — 7% от (shell + сети + ландшафт + проект)"
      source: "принято условно (SPEC.md)"

  sale_prices:
    # Цена м² квартир по классу жилья
    residential_by_class:
      type: conditional
      argument: residential_class
      cases:
        economy:  1.70
        comfort:  1.95
        business: 2.80
      unit: "unit_per_m2_apartments"
      source: "SPEC.md (типичная маржа РФ для эконома/комфорта/бизнеса); economy 1.55→1.70 по внешнему аудиту v0.10.20 (1.55 был заниженным стресс-вариантом)"
    # v0.9.1: калибровка по СПб 2024. Раньше (0.10/0.25/0.50) — кратно
    # заниженные значения из SPEC.md, давшие убыток у всех типов парковок.
    # Новые значения отражают реальные цены продажи м/м в СПб:
    #   подземное 1.5-2.5 млн руб ≈ 18 × P_comfort
    #   многоуровневое 0.8-1.2 млн руб ≈ 10 × P_comfort
    #   открытое 0.2-0.4 млн руб ≈ 3 × P_comfort
    parking_underground:
      type: scalar
      value: 18.0
      unit: "unit_per_space"
      note: "1.5-2.5 млн руб ≈ 18 у.е. (через P_comfort = 1.95 у.е./м²)"
      source: "СПб 2024, средняя по проектам комфорт-класса"
    parking_multilevel:
      type: scalar
      value: 10.0
      unit: "unit_per_space"
      note: "0.8-1.2 млн руб ≈ 10 у.е."
      source: "СПб 2024"
    parking_surface:
      type: scalar
      value: 3.0
      unit: "unit_per_space"
      note: "0.2-0.4 млн руб ≈ 3 у.е."
      source: "СПб 2024"
    vpp_commercial:
      type: scalar
      value: 1.30
      unit: "unit_per_m2"
      source: "SPEC.md (shell&core ритейл с отделкой арендатора)"

  # v0.9.14: доля реализации (продажи) машино-мест по классу жилья.
  # Раньше модель считала, что 100% построенных м/м продаются — это
  # завышало выручку парковок. В реальности доля покупки м/м сильно
  # зависит от класса: в эконом-классе берут редко, в бизнесе почти все.
  # Непроданные места приносят 0 выручки, но затраты на них уже понесены
  # (входят в cost.total) — поэтому избыточная подземка топит экономику.
  sale_rates:
    parking_by_class:
      type: conditional
      argument: residential_class
      cases:
        economy:  0.20    # эконом: м/м почти не покупают
        comfort:  0.45    # комфорт: 35-60% (берём середину)
        business: 0.75    # бизнес: 60-90%
      unit: "share"
      source: "СПб 2024 (доля реализации м/м по классам)"

  # v0.9.14: компенсация соцобъектов городом (бюджет / выкуп / льготы).
  # В реальной практике СПб застройщик НЕ строит ДОО/СОШ за чистый убыток —
  # часть затрат компенсируется бюджетом (выкуп объекта городом, льготы по
  # КОТ, мены и т.п.). Типичный диапазон: 60-90% от себестоимости объекта.
  # При 0 — соцобъекты полностью на застройщике (старая модель v0.9.13).
  # При 1.0 — полная компенсация.
  social_compensation:
    share:
      type: scalar
      value: 0.7
      note: "доля компенсации затрат на ДОО/СОШ от их себестоимости"
      source: "СПб 2024 (типовые соглашения КОТ/выкупа)"

  # Площадь м/м по типам — для расчёта стоимости через площадь, а не «штуки»
  parking_areas:
    underground_m2_per_space:
      type: scalar
      value: 35
      unit: "m2"
      source: "SPEC.md / СП 113.13330"
    multilevel_m2_per_space:
      type: scalar
      value: 28
      unit: "m2"
      source: "SPEC.md"
    # v0.9.11 (AUDIT P0-1): surface_m2_per_space удалён — экономика читает
    # parking.open_space_per_place=20.75 из основного норматива (единый
    # источник истины для площади открытого м/м).
