# Нормативы Санкт-Петербурга.
# Параметры, отсутствующие здесь, наследуются из russia.yaml.
parent: russia

# Семантические алиасы поверх ВРИ.
# В v0.1 жилая многоэтажная — ВРИ 2.6; ДОО/СОШ хранятся в social_objects (не по ВРИ).
aliases:
  housing: "vri.2.6"

# === Жильё ===

housing_provision:
  type: scalar
  value: 28
  unit: "m2_apartments_per_person"
  note: "региональная жилищная обеспеченность"
  source: "НГП СПб"

# КИТ: с/без ППТ
kit_limits:
  type: conditional
  argument: planning_doc
  cases:
    "yes": 2.5
    "no": 1.4
  source: "ПЗЗ СПб"

# Параметры жилых зданий (приняты условно)
building_params:
  apartments_to_gfa_ratio:
    type: scalar
    value: 0.75
    note: "коэффициент приведения общей площади к площади квартир (без ВПП)"
    source: "принято условно"
  residential_floor_height:
    type: scalar
    value: 3.0
    unit: "m"
    source: "принято условно"
  vpp_floor_height:
    type: scalar
    value: 4.0
    unit: "m"
    source: "принято условно"
  non_residential_floor_height:
    type: scalar
    value: 3.2
    unit: "m"
    source: "принято условно"

# === ЗНОП — кусочно-постоянная функция от КИТ ===
znop_per_person:
  type: piecewise
  argument: kit
  breakpoints:
    - { up_to: 1.59, value: 0 }
    - { up_to: 1.79, value: 3 }
    - { up_to: 1.99, value: 4 }
    - { up_to: 2.50, value: 6 }
  unit: "m2_per_person"
  source: "ПЗЗ СПб"

# === Озеленение ===
greening:
  housing_per_apartments:
    type: scalar
    value: 0.23
    note: "23 м² озеленения на 100 м² площади квартир (доля)"
    source: "ПЗЗ СПб"
  vpp_per_floor_area:
    type: scalar
    value: 0.15
    note: "15 м² на 100 м² встроенно-пристроенных помещений"
    source: "ПЗЗ СПб"

# === ДОО ===
social_objects:
  kindergarten:
    places_per_1000:
      type: scalar
      value: 61
      unit: "places_per_1000_people"
      source: "НГП СПб"
    rounding:
      type: scalar
      value: 5
      note: "округление вместимости вверх кратно 5"
      source: "НГП СПб"
    plot_area_per_place:   # переопределяет russia (отдельно стоящий ДОО)
      type: piecewise
      argument: capacity
      breakpoints:
        - { up_to: 100, value: 45 }
        - { up_to: .inf, value: 40 }
      unit: "m2_per_place"
      source: "РМД 31-07-2009"
    plot_area_per_place_built_in:   # встроенно-пристроенный ДОО (1-й этаж жилого дома)
      type: scalar
      value: 24
      unit: "m2_per_place"
      note: "минимальный участок для встроенно-пристроенного ДОО"
      source: "ПЗЗ СПб"
    # Список допустимых вместимостей ДОО (по данным КС). Если расчётная
    # вместимость не из списка — выдаётся WARNING с указанием ближайших.
    allowed_capacities:
      type: list
      values: [90, 100, 110, 120, 140, 150, 160, 165, 170, 180, 190, 200, 215, 220, 230, 240, 250, 260, 280, 310, 320, 340, 350]
      note: "типовые вместимости ДОО для отдельно стоящих и встроенных корпусов"
      source: "Данные КС по Замечаниям (ДОО - Санкт-Петербург)"
    building_area_per_place:
      type: piecewise
      argument: capacity
      breakpoints:
        - { up_to: 160, value: 30 }
        - { up_to: 220, value: 28 }
        - { up_to: .inf, value: 25 }
      unit: "m2_per_place"
      source: "РМД 15-26-2017"
    capacity_min:
      type: conditional
      argument: building_type
      cases:
        detached: 160   # нижний предел отдельно стоящего ДОО
        built_in: 120   # не менее 120 мест (минимальная наполняемость)
      source: "Письмо К.Обр №03-28-3794/21-0-0 от 29.04.2021"
    capacity_max:
      type: conditional
      argument: building_type
      cases:
        detached: 350
        built_in: 350   # явный максимум не установлен; принято как для отдельно стоящего
      sources:
        detached: "РМД 15-26-2017"
        built_in: "принято условно (явный предел нормативами не установлен)"
    # Число работников по вместимости (для расчёта парковок ДОО).
    # Значения по типовым проектам КС: точные для capacity ∈ {160, 220, 250},
    # остальное — линейная интерполяция/экстраполяция.
    workers_per_capacity:
      type: piecewise
      argument: capacity
      breakpoints:
        - { up_to: 90,  value: 33 }
        - { up_to: 100, value: 35 }
        - { up_to: 110, value: 38 }
        - { up_to: 120, value: 40 }
        - { up_to: 140, value: 45 }
        - { up_to: 150, value: 48 }
        - { up_to: 160, value: 50 }
        - { up_to: 165, value: 51 }
        - { up_to: 170, value: 53 }
        - { up_to: 180, value: 55 }
        - { up_to: 190, value: 58 }
        - { up_to: 200, value: 60 }
        - { up_to: 215, value: 64 }
        - { up_to: 220, value: 65 }
        - { up_to: 230, value: 68 }
        - { up_to: 240, value: 72 }
        - { up_to: 250, value: 75 }
        - { up_to: 260, value: 78 }
        - { up_to: 280, value: 85 }
        - { up_to: 310, value: 95 }
        - { up_to: 320, value: 98 }
        - { up_to: 340, value: 105 }
        - { up_to: .inf, value: 108 }
      unit: "workers"
      note: "Данные КС: точные значения для 160/220/250 мест; остальное — интерполяция"
      source: "Данные КС по Замечаниям (ДОО - Санкт-Петербург)"

  school:
    places_per_1000:
      type: scalar
      value: 120
      unit: "places_per_1000_people"
      source: "НГП СПб"
    rounding:
      type: scalar
      value: 25
      note: "округление вместимости вверх кратно 25 (1 параллель ≈ 25 мест)"
      source: "СП 42.13330.2016 (СП «Градостроительство»)"
    # Список допустимых вместимостей СОШ (по числу параллелей II–IX).
    # Если расчётная вместимость не попадает в список — выдаётся WARNING с
    # указанием ближайших значений из списка.
    allowed_capacities:
      type: list
      values: [550, 825, 1100, 1375, 1650, 1925, 2200, 2475]
      note: "II=550, III=825, IV=1100, V=1375, VI=1650, VII=1925, VIII=2200, IX=2475"
      source: "Данные КС по Замечаниям (СОШ - Санкт-Петербург)"
    # Площадь земельного участка на 1 место (переопределяет russia).
    # Значения II→35, III→28, IV/V→24, VI–IX→22 соответствуют СП 42.13330.2016
    # табл. 10.2 (св.30 мест) и уточнены конструкторами под типовые проекты СПб.
    plot_area_per_place:
      type: piecewise
      argument: capacity
      breakpoints:
        - { up_to: 550, value: 35 }
        - { up_to: 825, value: 28 }
        - { up_to: 1375, value: 24 }
        - { up_to: .inf, value: 22 }
      unit: "m2_per_place"
      note: "по параллелям II–IX (СП 42 + уточнения КС)"
      source: "СП 42.13330.2016, табл. 10.2 / уточнено по данным КС"
    building_area_per_place:
      type: piecewise
      argument: capacity
      breakpoints:
        - { up_to: 825, value: 30 }    # II, III параллели
        - { up_to: .inf, value: 25 }    # IV+
      unit: "m2_per_place"
      note: "II/III → 30, IV+ → 25 (РМД 15-26-2017 + уточнения КС)"
      source: "РМД 15-26-2017 / уточнено по данным КС"
    capacity_min:
      type: conditional
      argument: building_type
      cases:
        detached: 550
      source: "Письмо К.Обр №03-28-3794/21-0-0 от 29.04.2021"
    capacity_max:
      type: conditional
      argument: building_type
      cases:
        detached: 2475
      note: "Типовая школа: II/III/IV/V/VI/VII/VIII/IX параллели = 550/825/1100/1375/1650/1925/2200/2475 мест. Свыше 2475 — разбивать на корпуса."
      source: "Данные КС по Замечаниям"
    # Число работников по вместимости (для расчёта парковок СОШ).
    # Значения для параллелей II–IX (550/825/1100/1375/1650/1925/2200/2475).
    # Точные данные КС для capacity ∈ {550, 825, 1375}; остальное — оценка.
    workers_per_capacity:
      type: piecewise
      argument: capacity
      breakpoints:
        - { up_to: 550,  value: 90 }
        - { up_to: 825,  value: 135 }
        - { up_to: 1100, value: 178 }
        - { up_to: 1375, value: 220 }
        - { up_to: 1650, value: 263 }
        - { up_to: 1925, value: 305 }
        - { up_to: 2200, value: 348 }
        - { up_to: .inf, value: 390 }
      unit: "workers"
      note: "Данные КС: точные для 550/825/1375; остальное — линейная экстраполяция."
      source: "Данные КС по Замечаниям (СОШ - Санкт-Петербург)"

  # === Организации дополнительного образования детей (ВРИ 3.5.1) — v0.12.15 ===
  # По РМД 15-26-2017 + НГП СПб. Размещение по порогу 150 мест:
  #   < 150 → встроенно-пристроенное (ВПП): здание 17 м²/место, ЗУ не выделяется;
  #   ≥ 150 → отдельно стоящее: ЗУ 15 м²/место + 30% озеленения, здание 17 м²/место.
  # Парковка — по общей формуле parking.social_objects (как ДОУ/СОШ).
  add_education:
    vri_code: "3.5.1"
    places_per_1000:
      type: scalar
      value: 65
      unit: "places_per_1000_people"
      note: "посетители (места) доп. образования на 1000 жителей"
      source: "НГП СПб"
    workers_ratio:
      type: scalar
      value: 6
      note: "работники = места / 6 (принято условно)"
      source: "принято условно (на основе РМД 15-26-2017)"
    rounding:
      type: scalar
      value: 5
      unit: "places"
      note: "округление мест вверх кратно 5"
      source: "принято условно"
    built_in_threshold:
      type: scalar
      value: 150
      unit: "places"
      note: "< порога — встроенное (ВПП); ≥ — отдельно стоящее"
      source: "РМД 15-26-2017"
    building_area_per_place:
      type: scalar
      value: 17
      unit: "m2_per_place"
      note: "площадь здания на 1 место (и для ВПП, и для отд. стоящего)"
      source: "РМД 15-26-2017"
    plot_area_per_place:
      type: scalar
      value: 15
      unit: "m2_per_place"
      note: "ЗУ на 1 место (только отдельно стоящее)"
      source: "РМД 15-26-2017"
    greening_share:
      type: scalar
      value: 0.30
      note: "озеленение 30% ЗУ (только отд. стоящее; для ВПП — по правилу ВПП)"
      source: "ПЗЗ СПб (ВРИ 3.5.1)"
    max_floors:
      type: scalar
      value: 4
      unit: "floors"
      source: "РМД 15-26-2017"

  # === Амбулаторно-поликлинические учреждения (ВРИ 3.4.1) — v0.12.28 ===
  # Поликлиника (отд. стоящее) / офис врача общей практики (ВПП). НГП СПб +
  # СП 158.13330.2014. Единица — посещения в смену. Размещение по порогу 150
  # посещений (принято условно): < 150 → ВПП (1 объект ≤ 100 посещений →
  # дробление), ≥ 150 → отдельно стоящая поликлиника.
  polyclinic:
    vri_code: "3.4.1"
    visits_per_1000:
      type: scalar
      value: 26.33
      unit: "visits_per_shift_per_1000_people"
      note: "посещений в смену на 1000 жителей"
      source: "НГП СПб (приложение)"
    workers_ratio:
      type: scalar
      value: 6
      note: "работники = посещения / 6 (принято условно)"
      source: "принято условно"
    rounding:
      type: scalar
      value: 1
      unit: "visits"
      note: "округление посещений вверх до целого"
      source: "принято условно"
    built_in_threshold:
      type: scalar
      value: 150
      unit: "visits"
      note: "< порога — ВПП (офис врача); ≥ — отдельно стоящая поликлиника (условно)"
      source: "принято условно"
    vpp_object_max:
      type: scalar
      value: 100
      unit: "visits"
      note: "1 объект ВПП (офис врача) ≤ 100 посещений → дробление на N объектов"
      source: "СП 158.13330.2014"
    building_area_per_visit_vpp:
      type: scalar
      value: 12
      unit: "m2_per_visit"
      note: "площадь здания ВПП (офис врача) на 1 посещение"
      source: "принято условно с учётом табл. Е.1 СП 158.13330.2014"
    building_area_per_visit_detached:
      type: scalar
      value: 23
      unit: "m2_per_visit"
      note: "площадь здания отдельно стоящей поликлиники на 1 посещение"
      source: "принято условно"
    plot_per_visit:
      type: scalar
      value: 10
      unit: "m2_per_visit"
      note: "ЗУ отд. стоящего = 1000 м² на 100 посещений = 10 м²/посещение"
      source: "СП 158.13330.2014 (Табл. 5.1)"
    plot_min:
      type: scalar
      value: 2000
      unit: "m2"
      note: "минимальный ЗУ отдельно стоящей поликлиники"
      source: "СП 158.13330.2014 (Табл. 5.1)"
    greening_share:
      type: scalar
      value: 0.15
      note: "озеленение 15% ЗУ (только отд. стоящее; для ВПП — по правилу ВПП)"
      source: "ПЗЗ СПб (ВРИ 3.4.1)"
    parking_per_worker:
      type: scalar
      value: 5
      note: "1 м/м на 5 работников в максимальную смену"
      source: "ПЗЗ СПб"
    parking_per_visitor:
      type: scalar
      value: 40
      note: "1 м/м на 40 единовременных посетителей"
      source: "ПЗЗ СПб"
    parking_min:
      type: scalar
      value: 2
      unit: "places"
      source: "ПЗЗ СПб"

# === Парковки ===
parking:
  housing:
    m2_apartments_per_place:
      type: scalar
      value: 80
      unit: "m2_apartments_per_place"
      note: "1 машино-место на 80 м² общей площади квартир (ВРИ 2.1.1, 2.5, 2.6)"
      source: "ПЗЗ СПб"
  # Парковочные нормы для всех ВПП и нежилых объектов: средний коэф.
  # v0.7.1.1: переход с conditional-по-ВРИ на единый «средний по объекту»
  # 1.56 м/м на 100 м² = 64 м²/м.м. Источник: усреднение по типовым ВРИ.
  vpp:
    m2_per_place:
      type: scalar
      value: 64
      unit: "m2_per_place"
      note: "средний коэф 1.56 м/м на 100 м² → 64 м²/м.м для всех ВПП и кастомных объектов"
      source: "усреднение по ПЗЗ СПб (1.56 м/м на 100 м²)"
  open_share_min:
    type: scalar
    value: 0.125
    note: "не менее 12,5% от требуемого количества м/м — открытые в уровне земли"
    source: "ПЗЗ СПб"
  open_space_per_place:
    type: scalar
    value: 20.75
    unit: "m2"
    note: "стандартное открытое м/м с частью проезда"
    source: "принято условно"
  mgn_space_per_place:
    type: scalar
    value: 32.4
    unit: "m2"
    note: "м/м МГН с частью проезда"
    source: "принято условно"
  multilevel_capacity_max:
    type: scalar
    value: 300
    unit: "places"
    note: "СПб; уточнить норматив"
    source: "СПб (уточнить)"
  # v0.12.2: стилобатная парковка — площадь деки на 1 м/м.
  stylobate_area_per_place:
    type: scalar
    value: 35
    unit: "m2"
    note: "поднятый стилобат-паркинг, 1 уровень"
    source: "принято условно"
  # v0.12.20: доля деки стилобата ПОД жилыми домами (остальное — двор).
  # Под домами дека замещает 1-й жилой этаж (−1 этаж жилья там); этот этаж
  # считается стоимостью стилобата, НЕ жильём (иначе двойной счёт в экономике).
  stylobate_under_buildings_share:
    type: scalar
    value: 0.25
    note: "25% деки под домами (−1 этаж жилья); 75% — дворовая дека"
    source: "принято условно"
  # Максимальная вместимость одного подземного уровня. Условный потолок
  # для проверки реалистичности: при бо́льшем количестве подземных м/м
  # без увеличения числа уровней выдаётся WARNING (v0.8.5, AUDIT P0-7).
  underground_capacity_per_level:
    type: scalar
    value: 400
    unit: "places"
    note: "ориентир по типовому пятну подземки ~14000 м² (400 × 35 м²/место)"
    source: "принято условно"
  metro_proximity_discount:
    type: scalar
    value: 0.5
    note: "уменьшение на 50% в пределах 500 м от метрополитена"
    source: "ПЗЗ СПб <3>"

  # === Парковки соцобъектов (ДОО, СОШ) — v0.7.0 ===
  # Формула: 1 м/м на N работников + 1 м/м на M учащихся, не менее `minimum`.
  social_objects:
    per_worker:
      type: scalar
      value: 5
      note: "1 машино-место на 5 работников ДОО/СОШ"
      source: "ПЗЗ СПб"
    per_student:
      type: scalar
      value: 100
      note: "1 машино-место на 100 учащихся ДОО/СОШ"
      source: "ПЗЗ СПб"
    minimum:
      type: scalar
      value: 2
      note: "не менее 2 машино-мест на каждый объект ДОО/СОШ"
      source: "ПЗЗ СПб"

# === Проезды (приняты условно) ===
driveways:
  intra_quarter_share:
    type: scalar
    value: 0.075
    note: >-
      Доля от площади квартала. С v0.12 инженерная инфраструктура вынесена
      в отдельную секцию `engineering`; ранее (0.10) она была неявно учтена
      в проездах. Чистый транспорт = 7.5%.
    source: "принято условно"
  housing_lot_share:
    # Доля проездов на ЗУ жилой застройки от площади застройки. Зависит от
    # этажности: малоэтажная (≤4) застройка требует меньше проездов (100%
    # от пятна), многоэтажная — больше (120%, нужны разъезды/пожарные).
    type: piecewise
    argument: floors
    breakpoints:
      - { up_to: 4, value: 1.00 }
      - { up_to: .inf, value: 1.20 }
    note: "≤4 эт. — 100% от застройки; >4 эт. — 120%"
    source: "принято условно"
  # --- Гибридная схема внутриквартальных проездов (v0.18.0) ---
  # Проезды = S_квартала × intra_quarter_base_share + подъезды к объектам.
  # Территориальная база отражает магистральную сеть (шаг проездов задаёт
  # геометрия квартала, а не объём застройки), пообъектные добавки — подъезды
  # и развороты к каждому объекту.
  #
  # КАЛИБРОВКА по реальным проектам (факт «проезды между лотами» минус
  # пообъектные добавки, делённое на площадь квартала):
  #   Далта   73.3 га, 4 эт:      факт 55 330 (7.55% кв.) → k_base 6.53%
  #   Шушары 119.9 га, 13/7 эт:   факт 80 000 (6.67% кв.) → k_base 5.25%
  # Принято 0.06 как компромисс (Далта −7.0%, Шушары +11.3%).
  # Уточнить при поступлении новых фактических проектов.
  #
  # Проверена и ОТКЛОНЕНА схема «ЗУ_жилья × K(этажность)» с убывающим K
  # (0.10/0.08/0.06): факты показывают, что доля проездов от квартала почти
  # не зависит от этажности (7.55% при 4 эт против 6.67% при 7–13 эт), а
  # обратная калибровка K по фактам даёт ВОЗРАСТАЮЩУЮ шкалу (0.096 → 0.131).
  intra_quarter_base_share:
    type: scalar
    value: 0.06
    note: >-
      Территориальная база внутриквартальных проездов (магистральная сеть
      между лотами), доля от площади квартала. Откалибровано по проектам
      Далта/Шушары. Пообъектные подъезды считаются сверх этой базы.
    source: "принято условно (калибровка по фактическим проектам)"
  social_object_access_m2:
    # v0.17.0: подъезд/разворот к каждому соцобъекту — добавка к
    # внутриквартальным проездам за КАЖДЫЙ корпус ДОО (включая встроенные),
    # СОШ и иной отдельно стоящий объект (доп. образование, поликлиника,
    # пользовательские объекты).
    type: scalar
    value: 600
    unit: "м²/объект"
    note: "подъезд к соцобъекту; на каждый корпус ДОО (вкл. ВПП), СОШ и отд. стоящий объект"
    source: "принято условно (экспертная оценка)"
  other_object_access_m2:
    # v0.18.0: подъезд к прочему отдельно стоящему объекту — доп. образование,
    # поликлиника, пользовательские объекты, котельные и ОСПС.
    type: scalar
    value: 300
    unit: "м²/объект"
    note: "подъезд к иному отд. стоящему объекту (доп.обр, поликлиника, польз. объекты, котельная, ОСПС)"
    source: "принято условно (экспертная оценка)"
  engineering_object_access_m2:
    # v0.18.0: компактные инженерные объекты — ТП, РТП, ГРП, насосная (КНС).
    type: scalar
    value: 150
    unit: "м²/объект"
    note: "подъезд к компактному инженерному объекту (ТП, РТП, ГРП, насосная)"
    source: "принято условно (экспертная оценка)"
  parking_multilevel_access_m2:
    # v0.18.0: многоуровневые паркинги размещаются по периметру застройки,
    # обслуживаются существующей сетью → минимальная добавка.
    type: scalar
    value: 120
    unit: "м²/объект"
    note: "подъезд к многоуровневому паркингу (по периметру застройки)"
    source: "принято условно (экспертная оценка)"

# === Инженерная инфраструктура (v0.12) ===
# Ось — ВРИ 3.1 «Коммунальное обслуживание». Объекты, обслуживающие квартал:
# электроснабжение (ТП/РТП), теплоснабжение (котельная), газ (ГРП),
# водоотведение (ОСПС/насосная). Каждый занимает свой ЗУ и входит в баланс
# территории отдельным компонентом (ранее был неявно «зашит» в 10% проездов).
# Источник показателей: dict/Показатели инженерных объектов.docx.
engineering:
  # --- Электроснабжение: трансформаторные подстанции (ТП) ---
  tp:
    norm_per_apartments_by_cooking:
      # Сколько м² квартир обслуживает одна ТП. Зависит от типа плит:
      # электроплиты дают бóльшую электрическую нагрузку → меньше м² на ТП.
      # Газовые плиты — нагрузка ниже (часть энергии уходит на газ).
      # ВНИМАНИЕ: газовый коэффициент — ДЕМО-ХУК, уточнить по факт. нагрузкам.
      type: conditional
      argument: cooking
      cases:
        electric: 28000
        gas: 28000   # TODO демо: уточнить (с газом нагрузка на ТП ниже → больше м²)
      unit: "m2_apartments_per_tp"
      source: "dict/Показатели инженерных объектов.docx (электроплиты — текущий режим)"
    plus_per_social_object:
      type: scalar
      value: 1
      note: "доп. 1 ТП на каждый объект ДОО/СОШ/поликлиника"
      source: "dict/Показатели инженерных объектов.docx"
    plot_area:
      type: scalar
      value: 145
      unit: "m2"
      source: "dict/Показатели инженерных объектов.docx"
  # --- Распределительные ТП (РТП) ---
  rtp:
    per_tp:
      type: scalar
      value: 8
      note: "1 РТП на каждые 8 ТП"
      source: "dict/Показатели инженерных объектов.docx"
    plot_area:
      type: scalar
      value: 240
      unit: "m2"
      source: "dict/Показатели инженерных объектов.docx"
  # --- Теплоснабжение: котельная ---
  boiler:
    q_heat:
      type: scalar
      value: 0.10
      unit: "kW_per_m2_apartments"
      note: "удельная тепловая нагрузка; диапазон 0.08–0.10, принято 0.10 (запас)"
      source: "dict/Показатели инженерных объектов.docx"
    split_max_mw:
      type: scalar
      value: 50
      unit: "MW"
      note: ">50 МВт — делить (практическое решение); комфортная зона одной до 35"
      source: "dict/Показатели инженерных объектов.docx"
    plot_area_by_mw:
      type: piecewise
      argument: mw
      breakpoints:
        - { up_to: 5,   value: 1500 }
        - { up_to: 10,  value: 2500 }
        - { up_to: 20,  value: 3500 }
        - { up_to: 35,  value: 5000 }
        - { up_to: 50,  value: 6500 }
        - { up_to: 75,  value: 8000 }
        - { up_to: .inf, value: 10000 }
      unit: "m2"
      source: "dict/Показатели инженерных объектов.docx"
  # --- Газоснабжение: газорегуляторный пункт (ГРП) ---
  grp:
    per_boiler:
      type: scalar
      value: 1
      note: "1 ГРП на каждую котельную"
      source: "dict/Показатели инженерных объектов.docx"
    plot_area:
      type: scalar
      value: 350
      unit: "m2"
      source: "dict/Показатели инженерных объектов.docx (по исходным данным)"
  # --- Водоотведение: очистные сооружения поверхностного стока (ОСПС) ---
  osps:
    q_water:
      type: scalar
      value: 230
      unit: "l_per_person_day"
      note: "водоотведение на жителя; диапазон 200–250, принято 230 (как в примере docx)"
      source: "dict/Показатели инженерных объектов.docx"
    split_max_m3day:
      type: scalar
      value: 10000
      unit: "m3_day"
      note: ">10000 м³/сут — деление на очереди; нормальная зона одной 1000–4000"
      source: "dict/Показатели инженерных объектов.docx"
    plot_area_by_m3day:
      type: piecewise
      argument: m3day
      breakpoints:
        - { up_to: 500,   value: 1500 }
        - { up_to: 1000,  value: 2500 }
        - { up_to: 2000,  value: 4000 }
        - { up_to: 3000,  value: 6000 }
        - { up_to: 5000,  value: 8000 }
        - { up_to: 7500,  value: 10000 }
        - { up_to: .inf,  value: 12000 }
      unit: "m2"
      source: "dict/Показатели инженерных объектов.docx"
  # --- Насосная станция (при ОСПС) ---
  pump:
    per_osps:
      type: scalar
      value: 1
      note: "1 насосная станция на каждый ОСПС"
      source: "dict/Показатели инженерных объектов.docx"
    plot_area:
      type: scalar
      value: 230
      unit: "m2"
      source: "dict/Показатели инженерных объектов.docx"

# === Обязательные ВПП по НГП СПб (v0.7.1) ===
# Источник: «Обязательные ВПП по НГП - Санкт-Петербург».
# Норматив задаёт ОБЪЁМ потребности (мест/посещ./м²) на 1000 жителей.
# Коэф пересчёта «единица → м²» — типовые из СП 31-110-2003 / СНиП.
mandatory_vpp:
  # ВРИ 4.4 — Магазины (предприятия торговли с радиусом обслуживания 500 м)
  shopping_4_4:
    vri_code: "4.4"
    area_per_1000:
      type: scalar
      value: 460.10
      unit: "m2_per_1000_people"
      note: "Площадь сразу в м² (без пересчёта)"
      source: "НГП СПб (приложение)"
  # ВРИ 4.6 — Предприятия общественного питания
  catering_4_6:
    vri_code: "4.6"
    seats_per_1000:
      type: scalar
      value: 105.20
      unit: "seats_per_1000_people"
      note: "посадочных мест на 1000 жителей"
      source: "НГП СПб (приложение)"
    m2_per_seat:
      type: scalar
      value: 6
      unit: "m2_per_seat"
      note: "1 посадочное место общепита ≈ 6 м² (зал + подсобка), принято условно"
      source: "СП 31-110-2003 (раздел 6); СНиП 2.08.02-89 — обоснование зала"
  # ВРИ 3.3 — Предприятия бытового обслуживания
  domestic_3_3:
    vri_code: "3.3"
    workplaces_per_1000:
      type: scalar
      value: 19
      unit: "workplaces_per_1000_people"
      source: "НГП СПб (приложение)"
    m2_per_workplace:
      type: scalar
      value: 20
      unit: "m2_per_workplace"
      note: "1 рабочее место быт.обсл. ≈ 20 м² (с учётом подсобок), принято условно"
      source: "СП 31-110-2003, прил. Б"
  # v0.12.28: ВРИ 3.4.1 (поликлиника) вынесен из обязательных ВПП в отдельный
  # объект social_objects.polyclinic (карточка «Поликлиника» с режимами
  # норматив/вручную, ВПП-офис врача / отдельно стоящая, порог 150 посещений).
  # v0.12.15: ВРИ 3.5.1 (доп. образование) вынесен из обязательных ВПП в
  # отдельный объект social_objects.add_education (карточка «Доп. образование»
  # с режимами «по нормативу»/«вручную» и порогом 150 мест ВПП↔отд. стоящее).

