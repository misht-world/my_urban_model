# Светлая деловая тема для Streamlit-приложения urban_model.
# Синий primary, нейтральные серые фоны, чёткая типографика.

[theme]
base = "light"
primaryColor = "#1565C0"               # тёмно-синий — акценты (кнопки, ссылки)
backgroundColor = "#FFFFFF"            # белый — основной фон
secondaryBackgroundColor = "#F4F6F8"   # светло-серый — карточки, expanders
textColor = "#1F2937"                  # графитовый — основной текст
font = "sans serif"

[server]
# headless = true — обязательно для серверного деплоя (Streamlit Cloud):
# при false Streamlit запускает интерактивный welcome/email-промпт и сервер
# не поднимается (health check падает с connection refused). Локально просто
# не открывает браузер автоматически — адрес печатается в консоли.
headless = true

[browser]
gatherUsageStats = false
